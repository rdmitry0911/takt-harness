[package]
name = "takt-harness"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
license = "MIT"
description = "Measurement harness: user-mode cycles, instructions and wall time of a command, with a reviewable readings bundle"
readme = "README.md"
repository = "https://github.com/rdmitry0911/takt-harness"
homepage = "https://taktcycles.com"
keywords = ["benchmark", "perf", "cycles", "measurement"]
categories = ["command-line-utilities", "development-tools::profiling"]

[[bin]]
name = "takt-harness"
path = "src/main.rs"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
